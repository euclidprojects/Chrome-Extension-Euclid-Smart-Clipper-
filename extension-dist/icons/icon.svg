<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#046c4e"/>
    </linearGradient>

    <!-- 3D Yellow E Gradient -->
    <linearGradient id="yellowE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    
    <linearGradient id="yellowEExtrude" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Scissors Gradient -->
    <linearGradient id="scissorsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Document Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#a3e635" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.6"/>

  <!-- Target Corner Brackets (Lime Green) -->
  <!-- Top Left -->
  <path d="M 64 128 V 80 A 16 16 0 0 1 80 64 H 128" stroke="#a3e635" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Top Right -->
  <path d="M 384 64 H 432 A 16 16 0 0 1 448 80 V 128" stroke="#a3e635" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Bottom Left -->
  <path d="M 64 384 V 432 A 16 16 0 0 0 80 448 H 128" stroke="#a3e635" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Bottom Right -->
  <path d="M 384 448 H 432 A 16 16 0 0 0 448 432 V 384" stroke="#a3e635" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- Document Sheet (behind the right cutout of E) -->
  <g filter="url(#shadow)">
    <!-- Main Paper Body -->
    <path d="M 200 170 H 380 A 12 12 0 0 1 392 182 V 330 A 12 12 0 0 1 380 342 H 200 A 12 12 0 0 1 188 330 V 182 A 12 12 0 0 1 200 170 Z" fill="#ffffff"/>
    <!-- Folded Corner -->
    <path d="M 360 170 L 392 202 H 360 Z" fill="#e2e8f0"/>
    <!-- Document Text Lines -->
    <rect x="220" y="220" width="100" height="28" rx="6" fill="#10b981"/>
    <rect x="220" y="265" width="130" height="12" rx="4" fill="#a7f3d0"/>
    <rect x="220" y="290" width="90" height="12" rx="4" fill="#a7f3d0"/>
  </g>

  <!-- 3D Yellow E Motif -->
  <g filter="url(#shadow)">
    <!-- 3D Extrusion Shadow Layer -->
    <path d="M 100 110 H 330 C 345 110 350 120 340 135 L 320 165 C 315 172 305 175 295 175 H 175 V 230 H 260 C 272 230 275 238 270 248 L 255 272 C 250 280 240 285 228 285 H 175 V 345 H 330 C 345 345 350 355 340 370 L 320 400 C 315 407 305 410 295 410 H 100 A 16 16 0 0 1 84 394 V 126 A 16 16 0 0 1 100 110 Z" fill="url(#yellowEExtrude)" transform="translate(6, 12)"/>
    
    <!-- Front Yellow E Face -->
    <path d="M 100 100 H 330 C 345 100 350 110 340 125 L 320 155 C 315 162 305 165 295 165 H 175 V 220 H 260 C 272 220 275 228 270 238 L 255 262 C 250 270 240 275 228 275 H 175 V 335 H 330 C 345 335 350 345 340 360 L 320 390 C 315 397 305 400 295 400 H 100 A 16 16 0 0 1 84 384 V 116 A 16 16 0 0 1 100 100 Z" fill="url(#yellowE)"/>
  </g>

  <!-- Scissors Cut Action Icon -->
  <g filter="url(#shadow)" transform="translate(340, 290)">
    <!-- Scissor Blades -->
    <path d="M -10 -10 L 25 25 M -10 25 L 25 -10" stroke="url(#scissorsGrad)" stroke-width="10" stroke-linecap="round"/>
    <!-- Scissor Handles -->
    <circle cx="-16" cy="-16" r="14" fill="none" stroke="url(#scissorsGrad)" stroke-width="8"/>
    <circle cx="-16" cy="30" r="14" fill="none" stroke="url(#scissorsGrad)" stroke-width="8"/>
  </g>
</svg>
